name: Deploy site to Hostinger

# Pushes the contents of public_html/ to the Hostinger web root over FTP.
# Runs automatically whenever public_html/ changes on main, and can be run by hand.

on:
  push:
    branches: [main]
    paths:
      - "public_html/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  # Queue deploys — never cancel one mid-upload (an interrupted FTP sync can
  # leave the server and the sync-state file inconsistent).
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync public_html/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public_html/
          # This FTP account's login lands directly in the web root, so the
          # contents of local public_html/ map straight to "./". Do NOT set
          # this to ./public_html/ — that nests the whole site one level deep.
          server-dir: ./
          # Never let the sync delete server-managed files.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .htaccess
            .well-known/**
