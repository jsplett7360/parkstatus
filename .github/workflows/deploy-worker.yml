name: Deploy Cloudflare Worker

# Manual only. Publishes worker.js (the status API) to Cloudflare.
# Worker *secrets* (NPS_API_KEY, REBUILD_TOKEN, VAPID keys, RESEND_API_KEY,
# ARCGIS_API_KEY) are stored on Cloudflare and are NOT touched by a deploy.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: wrangler deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
